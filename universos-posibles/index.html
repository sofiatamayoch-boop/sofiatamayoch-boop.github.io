<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Universos Posibles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: festival juvenil, cálido y directo; frases cortas.
   IDEA: un póster-sticker que se recorre como un camino de 6 paradas.
   PICTURE: planeta lima con personajes haciendo actividades; tarjetas-sticker.
   COLOUR and TYPE: crema, negro, lima, azul, coral, morado · Archivo Black + Inter.
   LAYOUT: una columna en celular, rejilla de tarjetas; barra de avance arriba y botones grandes abajo. */
:root{color-scheme:light;--bg:#F7F2E8;--paper:#FFFDF7;--ink:#171717;--lime:#D9FF43;--blue:#315BEB;--coral:#FF7949;--purple:#9D79E8;--soft:#4A4A4A}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:'Archivo Black',Impact,sans-serif;font-weight:400;line-height:1.05;margin:0;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
/* barra de avance */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:3px solid var(--ink)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{font-family:'Archivo Black',sans-serif;font-size:15px;line-height:1;white-space:nowrap}
.prog{display:flex;gap:6px;flex:1}
.prog span{flex:1;height:12px;border:2px solid var(--ink);border-radius:9px;background:var(--paper)}
.prog span.on{background:var(--lime)}.prog span.now{background:var(--coral)}
.steplbl{font:700 13px 'Space Grotesk',sans-serif;white-space:nowrap}
/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 22px;border:3px solid var(--ink);border-radius:16px;background:var(--lime);font-family:'Archivo Black',sans-serif;font-size:17px;line-height:1.1;cursor:pointer;box-shadow:4px 4px 0 var(--ink);text-decoration:none;color:var(--ink);transition:transform .12s}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.btn.sec{background:var(--paper)}.btn.blue{background:var(--blue);color:#F7F2E8}.btn.coral{background:var(--coral)}.btn.sm{min-height:44px;font-size:14px;padding:8px 14px;box-shadow:3px 3px 0 var(--ink)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.nav{position:sticky;bottom:0;z-index:20;background:var(--bg);border-top:3px solid var(--ink)}
.nav .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;padding-block:10px}
.nav .count{font:700 15px 'Space Grotesk',sans-serif;text-align:center}
/* secciones */
.screen{padding:28px 0 40px}
.eyebrow{font:700 14px 'Space Grotesk',sans-serif;letter-spacing:1px;margin:0 0 8px}
.h1{font-size:clamp(34px,7vw,64px)}.h2{font-size:clamp(28px,5vw,44px)}
.lead{font-size:18px;font-weight:600;max-width:640px;margin:12px 0 0}
.note{border:3px solid var(--ink);border-radius:16px;background:var(--paper);padding:12px 16px;font-weight:600;margin:16px 0}
.note.lime{background:var(--lime)}.note.coral{background:var(--coral)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:8px 14px;border:3px solid var(--ink);border-radius:999px;background:var(--paper);font-weight:700;cursor:pointer;font-size:15px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--lime)}
.tag{display:inline-block;padding:2px 10px;border:2px solid var(--ink);border-radius:999px;font-size:13px;font-weight:700;background:var(--paper)}
.tag.hit{background:var(--lime)}
/* bienvenida */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:center}
.hero svg{width:100%;height:auto;display:block}
.privacy{font-size:14px;font-weight:600}
/* tarjetas de interés */
.search{display:flex;gap:10px;align-items:center;margin:18px 0 12px}
.search input{flex:1;min-height:52px;border:3px solid var(--ink);border-radius:16px;padding:10px 14px;font-size:17px;background:var(--paper)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;padding:12px;border:3px solid var(--ink);border-radius:20px;background:var(--paper);cursor:pointer;box-shadow:4px 4px 0 var(--ink);min-height:118px;transition:transform .15s,background .15s}
.card:hover{transform:translateY(-2px)}
.card[aria-pressed=true]{background:var(--lime)}
.card .ic{width:52px;height:52px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;flex:none}
.card .ic svg{width:34px;height:34px}
.card .nm{font-weight:800;font-size:16px;line-height:1.2}
.card .ok{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;border:3px solid var(--ink);background:var(--paper);display:grid;place-items:center}
.card[aria-pressed=true] .ok{background:var(--ink)}
.card .ok svg{width:16px;height:16px;opacity:0}.card[aria-pressed=true] .ok svg{opacity:1}
.cathead{display:flex;align-items:center;gap:10px;margin:26px 0 12px}
.cathead h3{font-size:22px}
/* sugerencias */
.recs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:18px}
.rec{min-height:150px}
.rec .ds{font-size:14px;font-weight:500;line-height:1.35}
.rec .why{font-size:13px;font-weight:700;color:var(--soft)}
.rec .pick{margin-top:auto;font:700 13px 'Space Grotesk',sans-serif;padding:4px 10px;border:2px solid var(--ink);border-radius:999px;background:var(--bg)}
.rec[aria-pressed=true] .pick{background:var(--ink);color:var(--lime)}
/* lugares */
.filters{display:grid;gap:14px;border:3px solid var(--ink);border-radius:20px;background:var(--paper);padding:16px;margin:18px 0}
.filters h3{font-size:16px;margin-bottom:8px}
.fz{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:14px;align-items:start}
.zmap svg{width:100%;height:auto;display:block}
.zmap button{all:unset}
select{min-height:48px;border:3px solid var(--ink);border-radius:14px;padding:8px 12px;background:var(--paper);font-size:16px;width:100%;max-width:340px}
.places{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.pl{border:3px solid var(--ink);border-radius:22px;background:var(--paper);box-shadow:5px 5px 0 var(--ink);padding:16px;display:flex;flex-direction:column;gap:8px}
.pl.sel{background:#F1FFC2}
.pl .kind{align-self:flex-start;font:700 12px 'Space Grotesk',sans-serif;letter-spacing:.5px;padding:4px 10px;border:2px solid var(--ink);border-radius:999px}
.pl h3{font-size:20px}
.pl p{margin:0;font-size:14px;line-height:1.45}
.pl .meta{font-size:13px;color:var(--soft);font-weight:600}
.pl .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:6px}
.k-faro{background:var(--coral)}.k-utopia{background:var(--purple)}.k-pilares{background:var(--lime)}.k-biblioteca{background:var(--blue);color:#F7F2E8}.k-cultural{background:var(--blue);color:#F7F2E8}.k-otro{background:var(--paper)}
.free{font-weight:800}
.sub{font-size:22px;margin:30px 0 4px}
.empty{border:3px dashed var(--ink);border-radius:20px;padding:20px;text-align:center;font-weight:600}
/* plan */
.form{display:grid;gap:22px;max-width:760px;margin-top:20px}
.form label,.qtitle{font-family:'Archivo Black',sans-serif;font-size:19px;display:block;margin-bottom:8px}
.form input[type=text]{width:100%;min-height:52px;border:3px solid var(--ink);border-radius:16px;padding:10px 14px;font-size:17px;background:var(--paper)}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;min-height:52px;padding:10px 14px;border:3px solid var(--ink);border-radius:16px;background:var(--paper);font-weight:700;cursor:pointer;text-align:left}
.opt[aria-checked=true]{background:var(--lime)}
.optc{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}.optc .opt{flex:1 1 260px}.lk{font-weight:700;color:#315BEB;padding:10px 4px;min-height:44px;display:inline-flex;align-items:center}
.opt .dot{width:22px;height:22px;border-radius:50%;border:3px solid var(--ink);flex:none;background:var(--paper)}
.opt[aria-checked=true] .dot{background:var(--ink)}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pills span{padding:6px 12px;border:2px solid var(--ink);border-radius:999px;background:var(--paper);font-weight:700;font-size:14px}
.steps3 svg{width:100%;max-width:520px;height:auto;display:block}
/* resumen */
.sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:20px}
.box{border:3px solid var(--ink);border-radius:22px;background:var(--paper);padding:18px;box-shadow:5px 5px 0 var(--ink)}
.box h3{font-size:18px;margin-bottom:10px}
.box.lime{background:var(--lime)}.box.purple{background:var(--purple)}.box.coral{background:var(--coral)}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--lime);padding:12px 18px;border-radius:14px;font-weight:700;max-width:90vw;text-align:center}
.pop{animation:pop .35s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:700px){.hero{grid-template-columns:1fr}.fz{grid-template-columns:1fr}.sum{grid-template-columns:1fr}.steplbl{display:none}.brand{font-size:13px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media print{.top,.nav,.actions,.noprint{display:none!important}body{background:#fff}.box{box-shadow:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>

 return `<section class="screen pop"><p class="eyebrow">PASO 5 DE 6</p><h1 class="h2">¡YA TIENES UNA NUEVA AVENTURA!</h1>
<div class="pills">${S.ints.map(i=>`<span>${esc(IM[i].n)}</span>`).join('')}${p?`<span style="background:#D9FF43">${esc(p.n)}</span>`:''}</div>
<div class="steps3" style="margin-top:18px"><svg viewBox="0 0 520 170" role="img" aria-label="Tres escalones que llevan a una bandera: la meta"><rect x="20" y="120" width="140" height="40" fill="#FFFDF7" stroke="#171717" stroke-width="4"/><rect x="160" y="80" width="140" height="80" fill="#FFFDF7" stroke="#171717" stroke-width="4"/><rect x="300" y="40" width="140" height="120" fill="#FFFDF7" stroke="#171717" stroke-width="4"/><rect x="20" y="120" width="140" height="10" fill="#D9FF43" stroke="#171717" stroke-width="4"/><rect x="160" y="80" width="140" height="10" fill="#9D79E8" stroke="#171717" stroke-width="4"/><rect x="300" y="40" width="140" height="10" fill="#FF7949" stroke="#171717" stroke-width="4"/><text x="90" y="152" text-anchor="middle" font-family="Archivo Black" font-size="22">1</text><text x="230" y="130" text-anchor="middle" font-family="Archivo Black" font-size="22">2</text><text x="370" y="110" text-anchor="middle" font-family="Archivo Black" font-size="22">3</text><path d="M470 160V20" stroke="#171717" stroke-width="5"/><path d="M472 22L512 34L472 48Z" fill="#D9FF43" stroke="#171717" stroke-width="3"/></svg></div>
<form class="form" data-k="form" onsubmit="return false">
<div><label for="learn">¿QUÉ QUIERES APRENDER?</label><input type="text" id="learn" data-k="learn" maxlength="120" placeholder="${esc(acts[0]&&A[acts[0]]?'Ej.: '+A[acts[0]].n:'Ej.: tocar guitarra')}" value="${esc(S.learn)}"></div>
<div>${placeOptions(p)}</div>
<div><span class="qtitle" id="fq">¿QUÉ HARÁS PRIMERO?</span><div class="opts" role="radiogroup" aria-labelledby="fq">${FIRST.map((f,i)=>`<button type="button" class="opt" role="radio" aria-checked="${S.first===f}" data-a="first" data-v="${f}" data-k="f-${i}"><span class="dot"></span>${f}</button>`).join('')}</div>
${S.first==='Otra idea'?`<label for="fo" class="sr">Tu idea</label><input type="text" id="fo" data-k="fo" maxlength="100" placeholder="Escribe tu idea" value="${esc(S.firstOther)}" style="margin-top:10px">`:''}</div>
<div><span class="qtitle" id="hq">¿QUIÉN PUEDE AYUDARTE? <span style="font-family:Inter;font-size:14px;font-weight:600">(opcional, sin nombres)</span></span><div class="chips" role="radiogroup" aria-labelledby="hq">${HELP.map((h,i)=>`<button type="button" class="chip" role="radio" aria-checked="${S.helper===h}" aria-pressed="${S.helper===h}" data-a="help" data-v="${h}" data-k="h-${i}">${h}</button>`).join('')}</div></div>
</form>
<p class="note coral">Si eres menor de edad, pide ayuda a una persona adulta de confianza antes de visitar un lugar o inscribirte.</p></section>`}
function planData(){const p=placeObj();return {ints:S.ints.map(i=>IM[i].n),acts:S.acts.map(a=>A[a].n),learn:S.learn.trim(),place:p,first:S.first==='Otra idea'?(S.firstOther.trim()||'Otra idea'):S.first,helper:S.helper}}
function s5(){const d=planData();
 const L=(arr,empty)=>arr.length?`<div class="pills">${arr.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`:`<p>${empty}</p>`;
 return `<section class="screen pop"><p class="eyebrow noprint">PASO 6 DE 6</p><h1 class="h2">¡MIRA TODO LO QUE DESCUBRISTE!</h1>
<div class="sum">
<div class="box lime"><h3>TUS INTERESES</h3>${L(d.ints,'Aún no elegiste intereses.')}</div>
<div class="box purple"><h3>LO QUE QUIERES PROBAR</h3>${L(d.acts,'Puedes elegir actividades en el paso 3.')}${d.learn?`<p><b>Quiero aprender:</b> ${esc(d.learn)}</p>`:''}</div>
<div class="box"><h3>EL LUGAR QUE ELEGISTE</h3>${d.place?`<p><b>${esc(d.place.n)}</b><br>${d.place.p?'Programa en varias sedes':esc(d.place.a)+(d.place.d?' · '+esc(d.place.d):'')}</p><p>Consulta si hay talleres disponibles.</p>${d.place.p?'':`<p><a class="btn blue sm" href="${mapsUrl(d.place)}" target="_blank" rel="noopener">VER CÓMO LLEGAR</a></p>`}`:'<p>Aún no eliges un lugar.</p>'}</div>
<div class="box coral"><h3>TU PRIMER PASO</h3><p>${d.first?esc(d.first):'Aún no lo eliges.'}</p>${d.helper?`<p><b>Me puede ayudar:</b> ${esc(d.helper)}</p>`:''}</div>
</div>
<div class="actions"><button class="btn" data-a="pdf" data-k="pdf" id="pdfbtn">DESCARGAR MI PLAN EN PDF</button><button class="btn sec" data-a="print" data-k="print">IMPRIMIR</button><button class="btn sec" data-a="copy" data-k="copy">COPIAR MI PLAN</button><button class="btn coral" data-a="again" data-k="again">EXPLORAR OTRA VEZ</button></div>
${S.reset?`<div class="note coral" role="alertdialog" aria-label="Confirmar"><b>¿Borrar tus respuestas y empezar de nuevo?</b><div class="chips" style="margin-top:10px"><button class="btn sm" data-a="resetyes" data-k="ry">Sí, empezar de nuevo</button><button class="btn sec sm" data-a="resetno" data-k="rn">No, regresar</button></div></div>`:''}
<p class="note">Si eres menor de edad, pide ayuda a una persona adulta de confianza antes de visitar un lugar o inscribirte.</p>
<p class="privacy">Universos Posibles · Tu origen es parte de tu historia, no el límite de tus posibilidades.</p></section>`}
const SCREENS=[s0,s1,s2,s3,s4,s5];

/* ================= RENDER ================= */
const app=document.getElementById('app'),nav=document.getElementById('nav');
function render(focusTop){
 const ae=document.activeElement,k=ae&&ae.dataset?ae.dataset.k:null,sel=ae&&'selectionStart'in ae?[ae.selectionStart,ae.selectionEnd]:null;
 app.innerHTML=SCREENS[S.step]();
 document.getElementById('prog').innerHTML=STEPS.map((_,i)=>`<span class="${i<S.step?'on':i===S.step?'now':''}"></span>`).join('');
 document.getElementById('steplbl').textContent=`${S.step+1}/6 · ${STEPS[S.step]}`;
 const nxt={0:'¡QUIERO EXPLORAR!',1:'DESCUBRIR MÁS',2:'BUSCAR LUGARES',3:'HACER MI PLAN',4:'VER MI UNIVERSO'}[S.step];
 const mid=S.step===1?`<span class="count" aria-live="polite">${S.ints.length} ${S.ints.length===1?'interés':'intereses'}</span>`:S.step===2?`<span class="count">${S.acts.length} elegidas</span>`:'';
 nav.innerHTML=`<div class="wrap">${S.step>0?`<button class="btn sec" data-a="go" data-v="${S.step-1}" data-k="prev">← Regresar</button>`:'<span></span>'}${mid}${nxt?`<button class="btn" data-a="go" data-v="${S.step+1}" data-k="next">${nxt} →</button>`:'<span></span>'}</div>`;
 if(focusTop){window.scrollTo({top:0});app.focus({preventScroll:true});document.getElementById('live').textContent=`Paso ${S.step+1} de 6: ${STEPS[S.step]}`}
 else if(k){const el=document.querySelector(`[data-k="${k}"]`);if(el){el.focus({preventScroll:true});if(sel&&'setSelectionRange'in el)try{el.setSelectionRange(sel[0],sel[1])}catch(e){}}}
}
function toast(t){const d=document.createElement('div');d.className='toast pop';d.setAttribute('role','status');d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}

/* ================= PDF (generado en el navegador) ================= */
function pdfBytes(d){
 const W=595,H=842,M=48;const pages=[];let ops=[],y=H-M;
 const enc=s=>String(s).replace(/[–—]/g,'-').replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/…/g,'...').replace(/[^\x20-\xFF]/g,'?').replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
 const newPage=()=>{pages.push(ops);ops=[];y=H-M};
 const text=(s,size,bold,color)=>{const maxc=Math.floor((W-2*M)/(size*0.52));const words=String(s).split(/\s+/);let line='';const lines=[];words.forEach(w=>{if((line+' '+w).trim().length>maxc){lines.push(line);line=w}else line=(line+' '+w).trim()});if(line)lines.push(line);
  lines.forEach(l=>{if(y<M+size)newPage();ops.push(`${color||'0.09 0.09 0.09'} rg BT /${bold?'F2':'F1'} ${size} Tf ${M} ${y-size} Td (${enc(l)}) Tj ET`);y-=size*1.35})};
 const gap=g=>{y-=g};
 const head=(t,c)=>{if(y<M+60)newPage();ops.push(`${c} rg ${M} ${y-26} ${W-2*M} 26 re f 0.09 0.09 0.09 RG 2 w ${M} ${y-26} ${W-2*M} 26 re S`);ops.push(`0.09 0.09 0.09 rg BT /F2 13 Tf ${M+10} ${y-18} Td (${enc(t)}) Tj ET`);y-=40};
 ops.push(`0.851 1 0.263 rg 0 ${H-120} ${W} 120 re f`);
 ops.push(`0.09 0.09 0.09 rg BT /F2 28 Tf ${M} ${H-62} Td (UNIVERSOS POSIBLES) Tj ET`);
 ops.push(`0.19 0.36 0.92 rg BT /F2 16 Tf ${M} ${H-90} Td (${enc('Mi plan: ¡mira todo lo que descubrí!')}) Tj ET`);
 y=H-150;
 head('MIS INTERESES','0.851 1 0.263');text(d.ints.join(' · ')||'Sin elegir todavía.',12);gap(10);
 head('LO QUE QUIERO PROBAR','0.616 0.475 0.91');text(d.acts.join(' · ')||'Sin elegir todavía.',12);if(d.learn){gap(4);text('Quiero aprender: '+d.learn,12,true)}gap(10);
 head('EL LUGAR QUE ELEGÍ','0.192 0.357 0.922');
 if(d.place){text(d.place.n,13,true);text(d.place.p?'Programa en varias sedes':(d.place.a+(d.place.d?' · '+d.place.d:'')),11);text('Consulta si hay talleres disponibles, horarios, edades e inscripción antes de ir.',11);text('Datos de los documentos del proyecto al '+FECHA+'.',10,false,'0.3 0.3 0.3')}else text('Todavía no elijo un lugar.',12);gap(10);
 head('MI PRIMER PASO','1 0.475 0.286');text(d.first||'Todavía no lo elijo.',12,true);if(d.helper)text('Me puede ayudar: '+d.helper,12);gap(14);
 text('Si eres menor de edad, pide ayuda a una persona adulta de confianza antes de visitar un lugar o inscribirte.',11,true,'0.75 0.2 0.1');gap(6);
 text('Universos Posibles · Proyecto de intervención comunitaria · Violencias y Construcción de Paz · Universidad Iberoamericana Ciudad de México · 2026',9,false,'0.3 0.3 0.3');
 pages.push(ops);
 const objs=[];const add=s=>{objs.push(s);return objs.length};
 const cat=add(''),pg=add('');const f1=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>'),f2=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
 const kids=[];pages.forEach(o=>{const s=o.join('\n');const c=add(`<< /Length ${s.length} >>\nstream\n${s}\nendstream`);kids.push(add(`<< /Type /Page /Parent ${pg} 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 ${f1} 0 R /F2 ${f2} 0 R >> >> /Contents ${c} 0 R >>`))});
 objs[cat-1]=`<< /Type /Catalog /Pages ${pg} 0 R >>`;objs[pg-1]=`<< /Type /Pages /Kids [${kids.map(k=>k+' 0 R').join(' ')}] /Count ${kids.length} >>`;
 let out='%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';const off=[];objs.forEach((o,i)=>{off.push(out.length);out+=`${i+1} 0 obj\n${o}\nendobj\n`});
 const x=out.length;out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+off.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<< /Size ${objs.length+1} /Root ${cat} 0 R >>\nstartxref\n${x}\n%%EOF`;
 const b=new Uint8Array(out.length);for(let i=0;i<out.length;i++)b[i]=out.charCodeAt(i)&255;return b;
}
function planText(){const d=planData();return ['UNIVERSOS POSIBLES — Mi plan','Mis intereses: '+(d.ints.join(', ')||'—'),'Quiero probar: '+(d.acts.join(', ')||'—'),d.learn?'Quiero aprender: '+d.learn:'','Lugar: '+(d.place?d.place.n+(d.place.d?' ('+d.place.d+')':''):'—'),'Mi primer paso: '+(d.first||'—'),d.helper?'Me puede ayudar: '+d.helper:'','Consulta si hay talleres disponibles antes de ir.'].filter(Boolean).join('\n')}
let downloads=null;
if(window.claude&&window.claude.use){window.claude.use('downloads').then(x=>{downloads=x}).catch(()=>{})}
async function savePdf(){
 const bytes=pdfBytes(planData());
 if(downloads){try{await downloads.save({filename:'mi-plan-universos-posibles.pdf',data:bytes});toast('¡Listo! Tu plan se descargó.');return}catch(e){if(e&&e.code==='declined'){toast('Descarga cancelada.');return}}}
 try{const url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));const a=document.createElement('a');a.href=url;a.download='mi-plan-universos-posibles.pdf';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast('Si no se descargó, usa “Copiar mi plan”.')}catch(e){toast('No se pudo descargar aquí. Usa “Copiar mi plan”.')}
}

/* ================= EVENTOS ================= */
app.addEventListener('input',e=>{const k=e.target.dataset.k;
 if(k==='q'){S.q=e.target.value;render()}else if(k==='learn')S.learn=e.target.value;else if(k==='fo')S.firstOther=e.target.value});
app.addEventListener('change',e=>{if(e.target.dataset.k==='alc'){S.alc=e.target.value;if(S.alc)S.zone='todas';render()}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
 switch(a){
 case'go':{const n=+v;if(n===2&&!S.ints.length){toast('Elige al menos un interés o toca “Sorpréndeme”.');if(S.step===1)return}S.step=Math.max(0,Math.min(5,n));S.reset=false;render(true);return}
 case'int':S.ints=tog(S.ints,v);break;
 case'cat':S.cat=v;break;
 case'unsure':S.unsure=!S.unsure;break;
 case'surprise':{const cs=Object.keys(CATS).sort(()=>Math.random()-.5).slice(0,3);const pick=cs.map(c=>{const l=I.filter(x=>x.c===c&&!has(S.ints,x.id));return l[Math.floor(Math.random()*l.length)]}).filter(Boolean);pick.forEach(p=>S.ints=tog(S.ints,p.id));toast(pick.length?'Agregamos: '+pick.map(p=>p.n).join(', '):'¡Ya elegiste muchísimo!');break}
 case'more':S.more=true;break;
 case'act':S.acts=tog(S.acts,v);break;
 case'zone':S.zone=v;if(v!=='todas')S.alc='';break;
 case'kind':S.kind=v;break;
 case'off':S.off=tog(S.off,v);break;
 case'plmore':S.plMore=true;break;
 case'optmore':S.optMore=true;break;
 case'clear':S.zone='todas';S.alc='';S.kind='todos';S.off=[];break;
 case'place':S.place=S.place===v?null:v;toast(S.place?'¡Lugar elegido! Puedes seguir a tu plan.':'Quitaste el lugar.');break;
 case'first':S.first=v;break;
 case'help':S.helper=S.helper===v?'':v;break;
 case'pdf':savePdf();return;
 case'print':try{window.print()}catch(err){}toast('Si no se abre la impresión, descarga el PDF e imprímelo.');return;
 case'copy':{const t=planText();(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Copiamos tu plan.'),()=>toast('No se pudo copiar aquí.'));return}
 case'again':S.reset=true;break;
 case'resetno':S.reset=false;break;
 case'resetyes':S=blank();render(true);return;
 default:return}
 render();
});
render();
}
</script>
